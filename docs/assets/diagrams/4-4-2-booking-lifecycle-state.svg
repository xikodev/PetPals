<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="1361px" preserveAspectRatio="none" style="width:836px;height:1361px;background:#FFFFFF;" version="1.1" viewBox="0 0 836 1361" width="836px" zoomAndPan="magnify"><title>PetPals - Booking Lifecycle State Diagram</title><defs/><g><g class="title" data-source-line="6"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="332.0352" x="245.0024" y="22.9951">PetPals - Booking Lifecycle State Diagram</text></g><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84.9971" x="364.41" y="178.2569"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.9971" x="369.41" y="203.1036">Requested</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="75.4609" x="123.17" y="446.7169"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="65.4609" x="128.17" y="471.5636">Accepted</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="71.2432" x="605.28" y="446.7169"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61.2432" x="610.28" y="471.5636">Declined</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="88.0596" x="67.87" y="722.7469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="78.0596" x="72.87" y="747.5936">In Progress</text><rect fill="#F1F1F1" height="40" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="86.3574" x="374.73" y="900.2769"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="76.3574" x="379.73" y="925.1236">Completed</text><ellipse cx="406.9" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="771.9" cy="1051.6769" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="771.9" cy="1051.6769" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="38" data-uid="ent0003" id="entity_GMN2"><path d="M6,140.2969 L6,256.2266 A0,0 0 0 0 6,256.2266 L329.8086,256.2266 A0,0 0 0 0 329.8086,256.2266 L329.8086,202.2569 L364.18,198.2569 L329.8086,194.2569 L329.8086,150.2969 L319.8086,140.2969 L6,140.2969 A0,0 0 0 0 6,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M319.8086,140.2969 L319.8086,150.2969 L329.8086,150.2969 L319.8086,140.2969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.8086" x="12" y="157.3638">Only approved, unsuspended users may book.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="12" y="172.4966">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.0923" x="12" y="187.6294">The selected pet must belong to the owner.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="12" y="202.7622">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="296.3721" x="12" y="217.895">The listing and requested time must be valid.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="12" y="233.0278">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.4141" x="12" y="248.1606">Invalid requests do not create a booking.</text></g><g class="entity" data-entity="GMN5" data-source-line="49" data-uid="ent0006" id="entity_GMN5"><path d="M233.21,348.2269 L233.21,462.7169 L199.13,466.7169 L233.21,470.7169 L233.21,585.2191 A0,0 0 0 0 233.21,585.2191 L554.6001,585.2191 A0,0 0 0 0 554.6001,585.2191 L554.6001,358.2269 L544.6001,348.2269 L233.21,348.2269 A0,0 0 0 0 233.21,348.2269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M544.6001,348.2269 L544.6001,358.2269 L554.6001,358.2269 L544.6001,348.2269" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.3125" x="239.21" y="365.2938">Stored database value: accepted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="243.5342" x="239.21" y="380.4266">User-facing label may be "Accepted".</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="239.21" y="395.5594">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.2344" x="239.21" y="410.6922">Google Calendar synchronization occurs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.4473" x="239.21" y="425.825">after acceptance. A failed synchronization</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.728" x="239.21" y="440.9578">does not undo the accepted booking.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="239.21" y="456.0906">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="300.3901" x="239.21" y="471.2235">The booked helper initiates Start confirmation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.9087" x="239.21" y="486.3563">using either QR code or in-app buttons.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="239.21" y="501.4891">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.2744" x="239.21" y="516.6219">Both participants must confirm the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.0645" x="239.21" y="531.7547">unexpired attempt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="239.21" y="546.8875">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0444" x="239.21" y="562.0203">A one-sided or expired confirmation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.3159" x="239.21" y="577.1531">does not advance the booking.</text></g><g class="entity" data-entity="GMN8" data-source-line="68" data-uid="ent0009" id="entity_GMN8"><path d="M190.77,677.2169 L190.77,738.7469 L156.33,742.7469 L190.77,746.7469 L190.77,808.2794 A0,0 0 0 0 190.77,808.2794 L479.0444,808.2794 A0,0 0 0 0 479.0444,808.2794 L479.0444,687.2169 L469.0444,677.2169 L190.77,677.2169 A0,0 0 0 0 190.77,677.2169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M469.0444,677.2169 L469.0444,687.2169 L479.0444,687.2169 L469.0444,677.2169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.5532" x="196.77" y="694.2838">The booked helper initiates Completion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.9087" x="196.77" y="709.4166">using either QR code or in-app buttons.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="196.77" y="724.5494">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="267.2744" x="196.77" y="739.6822">Both participants must confirm the same</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.7251" x="196.77" y="754.815">unexpired completion attempt.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="196.77" y="769.9478">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="234.0444" x="196.77" y="785.0806">A one-sided or expired confirmation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.1787" x="196.77" y="800.2135">leaves the booking In Progress.</text></g><g class="entity" data-entity="GMN11" data-source-line="80" data-uid="ent0012" id="entity_GMN11"><path d="M266.97,1001.2769 L266.97,1102.0738 A0,0 0 0 0 266.97,1102.0738 L568.8474,1102.0738 A0,0 0 0 0 568.8474,1102.0738 L568.8474,1011.2769 L558.8474,1001.2769 L421.9,1001.2769 L417.9,940.6569 L413.9,1001.2769 L266.97,1001.2769 A0,0 0 0 0 266.97,1001.2769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M558.8474,1001.2769 L558.8474,1011.2769 L568.8474,1011.2769 L558.8474,1001.2769" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="280.8774" x="272.97" y="1018.3438">Reviews are allowed only after completion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="272.97" y="1033.4766">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="247.1968" x="272.97" y="1048.6094">Both participants may leave a review.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="272.97" y="1063.7422">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.2764" x="272.97" y="1078.875">Disputes are tracked independently</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="142.1304" x="272.97" y="1094.0078">of the booking status.</text></g><g class="entity" data-entity="GMN14" data-source-line="90" data-uid="ent0015" id="entity_GMN14"><path d="M513.58,722.6169 L513.58,762.8825 A0,0 0 0 0 513.58,762.8825 L768.2372,762.8825 A0,0 0 0 0 768.2372,762.8825 L768.2372,732.6169 L758.2372,722.6169 L644.9,722.6169 L640.9,486.9869 L636.9,722.6169 L513.58,722.6169 A0,0 0 0 0 513.58,722.6169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M758.2372,722.6169 L758.2372,732.6169 L768.2372,732.6169 L758.2372,722.6169" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.6572" x="519.58" y="739.6838">A declined booking cannot progress</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.4194" x="519.58" y="754.8166">to service confirmation.</text></g><!--link *start* to Requested--><g class="link" data-entity-1=".start." data-entity-2="Requested" data-source-line="19" data-uid="lnk3" id="link_.start._Requested"><path d="M406.9,63.6769 C406.9,86.7869 406.9,140.8369 406.9,171.9469" fill="none" id="*start*-to-Requested" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="406.9,177.9469,410.9,168.9469,406.9,172.9469,402.9,168.9469,406.9,177.9469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184.9072" x="407.9" y="106.3638">Valid booking request saved</text></g><!--link Requested to Declined--><g class="link" data-entity-1="Requested" data-entity-2="Declined" data-source-line="22" data-uid="lnk4" id="link_Requested_Declined"><path d="M446.27,218.7169 C474.57,234.1369 512.27,257.7769 538.9,286.2269 C585.57,336.0669 617.0247,405.5628 631.2047,440.7028" fill="none" id="Requested-to-Declined" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="633.45,446.2669,633.7915,436.4239,631.579,441.6302,626.3727,439.4176,633.45,446.2669" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="100.7437" x="577.071" y="299.2938">Helper declines</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.2456" x="564.82" y="314.4266">[authorized helper]</text></g><!--link Requested to Accepted--><g class="link" data-entity-1="Requested" data-entity-2="Accepted" data-source-line="24" data-uid="lnk5" id="link_Requested_Accepted"><path d="M391.31,218.7269 C380.22,231.2769 364.25,246.9369 346.9,256.2269 C293.86,284.6169 258.88,245.1669 214.9,286.2269 C168.99,329.0869 161.7598,403.3385 160.8998,440.2485" fill="none" id="Requested-to-Accepted" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="160.76,446.2469,164.9686,437.3425,160.8765,441.2482,156.9707,437.1561,160.76,446.2469" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.4937" x="324.3497" y="299.2938">Helper accepts</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314.3931" x="215.9" y="314.4266">[authorized helper and slot reserved atomically]</text></g><!--link Accepted to InProgress--><g class="link" data-entity-1="Accepted" data-entity-2="InProgress" data-source-line="27" data-uid="lnk6" id="link_Accepted_InProgress"><path d="M157.46,486.9869 C148.46,537.3069 125.3958,666.3005 116.4058,716.5905" fill="none" id="Accepted-to-InProgress" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="115.35,722.4969,120.8713,714.3412,116.2299,717.5749,112.9962,712.9334,115.35,722.4969" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="101.6768" x="229.085" y="628.2838">Start confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9067" x="134.47" y="643.4166">[both participants, same unexpired attempt]</text></g><!--link InProgress to Completed--><g class="link" data-entity-1="InProgress" data-entity-2="Completed" data-source-line="30" data-uid="lnk7" id="link_InProgress_Completed"><path d="M126.82,763.1769 C138.26,777.1069 155.08,795.5669 172.9,808.2769 C237.16,854.0969 317.6767,885.844 368.8367,903.454" fill="none" id="InProgress-to-Completed" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="374.51,905.4069,367.3019,898.6954,369.7822,903.7795,364.6981,906.2598,374.51,905.4069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="144.3774" x="356.1246" y="851.3438">Completion confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="290.9067" x="282.86" y="866.4766">[both participants, same unexpired attempt]</text></g><!--link Declined to *end*--><g class="link" data-entity-1="Declined" data-entity-2=".end." data-source-line="33" data-uid="lnk9" id="link_Declined_.end."><path d="M660.65,487.1369 C694.18,521.6669 761.05,597.6269 785.9,677.2169 C829.04,815.3269 787.932,990.4058 776.222,1034.7458" fill="none" id="Declined-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="774.69,1040.5469,780.8555,1032.8666,775.9667,1035.7126,773.1207,1030.8239,774.69,1040.5469" style="stroke:#181818;stroke-width:1;"/></g><!--link Completed to *end*--><g class="link" data-entity-1="Completed" data-entity-2=".end." data-source-line="34" data-uid="lnk10" id="link_Completed_.end."><path d="M461.31,937.1469 C543.47,967.1769 711.8048,1028.7067 755.9248,1044.8367" fill="none" id="Completed-to-*end*" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="761.56,1046.8969,754.4807,1040.0498,756.864,1045.18,751.7337,1047.5634,761.56,1046.8969" style="stroke:#181818;stroke-width:1;"/></g><g class="legend" data-source-line="95"><rect fill="#DDDDDD" height="221.8594" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="313.2764" x="254.3818" y="1120.0738"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="303.2764" x="259.3818" y="1138.0689">Separate status fields (not booking states):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="259.3818" y="1154.3657">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="210.998" x="259.3818" y="1170.6626">booking_confirmations.status:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="198.4883" x="259.3818" y="1186.9595">pending, confirmed, expired</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="259.3818" y="1203.2564">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="206.377" x="259.3818" y="1219.5532">calendar_events.sync_status:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.1465" x="259.3818" y="1235.8501">pending, synced, failed</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="259.3818" y="1252.147">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="111.4121" x="259.3818" y="1268.4439">disputes.status:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.7422" x="259.3818" y="1284.7407">open, resolved</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="259.3818" y="1301.0376">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="227.835" x="259.3818" y="1317.3345">Cancellation and no-show states</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="250.1543" x="259.3818" y="1333.6314">are not defined in the current draft.</text></g><!--SRC=[jLPDZzis4BthLmnoILFOFXGvxI70PXTf5mYGJJRj9LqiQ79a4Q58XKFPSNvzPoXHabqtHGlaP9Fp_URDKC_X7jEzSWHhU42TRF3mSlDoyqlr75w7yDdw7RorDUgZTWWFIIM4MwjsKRMYeGWDi8bHIMtvi6aDA6yWDJWvZlYbjn5Rz8coi2S4pSfKLSacXuiK_YraHIpk5Fy5QfG91r6ksHQhnXe4RBjq18Eae-sac6fH1uahgl8FFFl0QI4bDCz04Kod8hxM6hiYBOSYl4Njh1-5vL24TnxkOzX59ChoEr-EHUCcj9t3udmwIQvttYQht91hzUddHrYlNytPmHNyePmri1rhYeC4IEq71x-Xwp0o1DgIr3-RYgEIA_kP5UM6_lIVL9-Q4Eqt5ZTP-5YTcHSSPdELRovQvrwJ2ucJ98oS7wWKMgkLSyT7oVM1Rwr6AJOcqC7NDhOgjssA965d13dmmr8P3KVUXjG0ao9PRJl5B5in72r2x_5hnyoJk4cOSH9K3x0BuKyYBu99xAax7FhcRoR_8_uRwqj_gPhw8Q6uszKShjmi2BoNrkSi8VQEpNrWEZci4uHwGM60TzuTGNLT30pxYZEXdZhq1lFqHO9M7JE7DXLhV-Hf9NGy_YplC47RCwMsw087JI5FSpXuZ9EsivGa8sbnd2YIB5SzsWx9PeCxd_yNHG8JW3C77L76GHKoRohEK2GeHKyCcAW-bnpjhiarJuC9p8iWK9TD9F5xl1e9cZL-vyhNjTBYp2akRq1XEUmvtrz3sF7ckL6Eyr4HwEXr4uEttmRiWzPz95PKTPf6G7cD6xZcPMGTft5cmyec8EMoUsy6IDLPXHEwSfx7oEQLm6mvfNxnsvFKWvOzHdZ_WSMy1uEOhPa0iErJ2fwoxzVdH1sQDJhCEGbnnUavTRFzDQzwN9CL6d64edAMq5IeCdj19VkzsE8BetYfoOi5-dryvldyyRWiSlxl43daTKrBO63nQfo2D6-42uF0guTNge0qloB0cs1lyS2FRMIIEHSE-P6MZP09EwV-JzNpMEGKUJPZzfKLRorrlU0iVbDKMffWUQdapUAJEx8Ifx8iI_PSVrRHjFI-Mz3qh0gevjn4AoyKwsPYy9wYYKypsgUXtsKsq97NLLjsiCETg0oHPP6WV60a77E7sg8p13z9lEt9fyIBAu5bl7jQHgNDO7p5Sa67vQlvpLWLNeYv7jVC4-xb2saZc-FfWhNSY-cmOCJIZFrOn0gilfBtDhZze7GZ8-ZSiBbKXc9DJJYKwY5tKsepM6U8hSyTv1qNEI4maLcJKHo0glu2]--></g></svg>