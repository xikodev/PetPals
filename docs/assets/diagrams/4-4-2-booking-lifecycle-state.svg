<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:845px;height:1363px;background:#FFFFFF;" width="845px" height="1363px" viewBox="0 0 845 1363" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="5"><text x="253.002" y="22.995" fill="#000" font-size="14" textLength="332.035" font-weight="700">PetPals - Booking Lifecycle State Diagram</text></g><rect x="364.41" y="178.257" width="84.997" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="369.41" y="203.104" fill="#000" font-size="14" textLength="74.997">Requested</text><rect x="124.17" y="446.717" width="75.461" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="129.17" y="471.564" fill="#000" font-size="14" textLength="65.461">Accepted</text><rect x="606.28" y="446.717" width="71.243" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="611.28" y="471.564" fill="#000" font-size="14" textLength="61.243">Declined</text><rect x="68.87" y="722.747" width="88.06" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="73.87" y="747.594" fill="#000" font-size="14" textLength="78.06">In Progress</text><rect x="375.73" y="900.277" width="86.357" height="40" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="380.73" y="925.124" fill="#000" font-size="14" textLength="76.357">Completed</text><g class="start_entity" data-qualified-name=".start." id="ent0006" data-source-line="18"><ellipse cx="406.9" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="32"><ellipse cx="772.9" cy="1051.677" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="772.9" cy="1051.677" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="37"><path d="M6,140.297 L6,256.227 A0,0 0 0 0 6,256.227 L329.809,256.227 A0,0 0 0 0 329.809,256.227 L329.809,202.257 L364.18,198.257 L329.809,194.257 L329.809,150.297 L319.809,140.297 L6,140.297 A0,0 0 0 0 6,140.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M319.809,140.297 L319.809,150.297 L329.809,150.297 L319.809,140.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="12" y="157.364" fill="#000" font-size="13" textLength="302.809">Only approved, unsuspended users may book.</text><text x="12" y="172.497" fill="#000" font-size="13"> </text><text x="12" y="187.629" fill="#000" font-size="13" textLength="285.092">The selected pet must belong to the owner.</text><text x="12" y="202.762" fill="#000" font-size="13"> </text><text x="12" y="217.895" fill="#000" font-size="13" textLength="296.372">The listing and requested time must be valid.</text><text x="12" y="233.028" fill="#000" font-size="13"> </text><text x="12" y="248.161" fill="#000" font-size="13" textLength="267.414">Invalid requests do not create a booking.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="48"><path d="M234.21,348.227 L234.21,462.717 L200.13,466.717 L234.21,470.717 L234.21,585.219 A0,0 0 0 0 234.21,585.219 L555.6,585.219 A0,0 0 0 0 555.6,585.219 L555.6,358.227 L545.6,348.227 L234.21,348.227 A0,0 0 0 0 234.21,348.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M545.6,348.227 L545.6,358.227 L555.6,358.227 L545.6,348.227" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="240.21" y="365.294" fill="#000" font-size="13" textLength="215.313">Stored database value: accepted</text><text x="240.21" y="380.427" fill="#000" font-size="13" textLength="245.388">User-facing label may be "Approved".</text><text x="240.21" y="395.559" fill="#000" font-size="13"> </text><text x="240.21" y="410.692" fill="#000" font-size="13" textLength="262.234">Google Calendar synchronization occurs</text><text x="240.21" y="425.825" fill="#000" font-size="13" textLength="274.447">after acceptance. A failed synchronization</text><text x="240.21" y="440.958" fill="#000" font-size="13" textLength="242.728">does not undo the accepted booking.</text><text x="240.21" y="456.091" fill="#000" font-size="13"> </text><text x="240.21" y="471.223" fill="#000" font-size="13" textLength="300.39">The booked helper initiates Start confirmation</text><text x="240.21" y="486.356" fill="#000" font-size="13" textLength="256.909">using either QR code or in-app buttons.</text><text x="240.21" y="501.489" fill="#000" font-size="13"> </text><text x="240.21" y="516.622" fill="#000" font-size="13" textLength="267.274">Both participants must confirm the same</text><text x="240.21" y="531.755" fill="#000" font-size="13" textLength="126.064">unexpired attempt.</text><text x="240.21" y="546.888" fill="#000" font-size="13"> </text><text x="240.21" y="562.02" fill="#000" font-size="13" textLength="234.044">A one-sided or expired confirmation</text><text x="240.21" y="577.153" fill="#000" font-size="13" textLength="201.316">does not advance the booking.</text></g><g class="entity" data-qualified-name="GMN21" id="ent0022" data-source-line="67"><path d="M191.77,677.217 L191.77,738.747 L157.33,742.747 L191.77,746.747 L191.77,808.279 A0,0 0 0 0 191.77,808.279 L480.044,808.279 A0,0 0 0 0 480.044,808.279 L480.044,687.217 L470.044,677.217 L191.77,677.217 A0,0 0 0 0 191.77,677.217" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M470.044,677.217 L470.044,687.217 L480.044,687.217 L470.044,677.217" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="197.77" y="694.284" fill="#000" font-size="13" textLength="256.553">The booked helper initiates Completion</text><text x="197.77" y="709.417" fill="#000" font-size="13" textLength="256.909">using either QR code or in-app buttons.</text><text x="197.77" y="724.549" fill="#000" font-size="13"> </text><text x="197.77" y="739.682" fill="#000" font-size="13" textLength="267.274">Both participants must confirm the same</text><text x="197.77" y="754.815" fill="#000" font-size="13" textLength="202.725">unexpired completion attempt.</text><text x="197.77" y="769.948" fill="#000" font-size="13"> </text><text x="197.77" y="785.081" fill="#000" font-size="13" textLength="234.044">A one-sided or expired confirmation</text><text x="197.77" y="800.213" fill="#000" font-size="13" textLength="204.179">leaves the booking In Progress.</text></g><g class="entity" data-qualified-name="GMN24" id="ent0025" data-source-line="79"><path d="M267.97,1001.277 L267.97,1102.074 A0,0 0 0 0 267.97,1102.074 L569.847,1102.074 A0,0 0 0 0 569.847,1102.074 L569.847,1011.277 L559.847,1001.277 L422.9,1001.277 L418.9,940.657 L414.9,1001.277 L267.97,1001.277 A0,0 0 0 0 267.97,1001.277" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M559.847,1001.277 L559.847,1011.277 L569.847,1011.277 L559.847,1001.277" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="273.97" y="1018.344" fill="#000" font-size="13" textLength="280.877">Reviews are allowed only after completion.</text><text x="273.97" y="1033.477" fill="#000" font-size="13"> </text><text x="273.97" y="1048.609" fill="#000" font-size="13" textLength="247.197">Both participants may leave a review.</text><text x="273.97" y="1063.742" fill="#000" font-size="13"> </text><text x="273.97" y="1078.875" fill="#000" font-size="13" textLength="233.276">Disputes are tracked independently</text><text x="273.97" y="1094.008" fill="#000" font-size="13" textLength="142.13">of the booking status.</text></g><g class="entity" data-qualified-name="GMN27" id="ent0028" data-source-line="89"><path d="M514.58,722.617 L514.58,762.882 A0,0 0 0 0 514.58,762.882 L769.237,762.882 A0,0 0 0 0 769.237,762.882 L769.237,732.617 L759.237,722.617 L645.9,722.617 L641.9,486.987 L637.9,722.617 L514.58,722.617 A0,0 0 0 0 514.58,722.617" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M759.237,722.617 L759.237,732.617 L769.237,732.617 L759.237,722.617" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="520.58" y="739.684" fill="#000" font-size="13" textLength="233.657">A declined booking cannot progress</text><text x="520.58" y="754.817" fill="#000" font-size="13" textLength="154.419">to service confirmation.</text></g><!--link *start* to Requested--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="18" data-link-type="dependency"><path d="M406.9,63.677 C406.9,86.787 406.9,141.837 406.9,172.947" style="stroke:#181818;stroke-width:1;" fill="none" id="*start*-to-Requested"/><polygon points="406.9,177.947,410.9,168.947,406.9,172.947,402.9,168.947,406.9,177.947" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="407.9" y="106.364" fill="#000" font-size="13" textLength="184.907">Valid booking request saved</text></g><!--link Requested to Declined--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk8" data-source-line="21" data-link-type="dependency"><path d="M446.58,218.657 C475.09,234.037 513.08,257.677 539.9,286.227 C586.66,335.987 618.443,406.449 632.603,441.619" style="stroke:#181818;stroke-width:1;" fill="none" id="Requested-to-Declined"/><polygon points="634.47,446.257,634.819,436.414,632.603,441.619,627.398,439.402,634.47,446.257" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="577.151" y="299.294" fill="#000" font-size="13" textLength="100.744">Helper declines</text><text x="564.9" y="314.427" fill="#000" font-size="13" textLength="125.246">[authorized helper]</text></g><!--link Requested to Accepted--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M391.3,218.717 C380.21,231.267 364.25,246.927 346.9,256.227 C294.27,284.457 259.53,245.427 215.9,286.227 C170.03,329.117 162.746,404.358 161.886,441.258" style="stroke:#181818;stroke-width:1;" fill="none" id="Requested-to-Accepted"/><polygon points="161.77,446.257,165.979,437.353,161.886,441.258,157.981,437.166,161.77,446.257" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="325.35" y="299.294" fill="#000" font-size="13" textLength="97.494">Helper accepts</text><text x="216.9" y="314.427" fill="#000" font-size="13" textLength="314.393">[authorized helper and slot reserved atomically]</text></g><!--link Accepted to InProgress--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="26" data-link-type="dependency"><path d="M158.46,486.987 C149.46,537.307 126.22,667.285 117.23,717.575" style="stroke:#181818;stroke-width:1;" fill="none" id="Accepted-to-InProgress"/><polygon points="116.35,722.497,121.871,714.341,117.23,717.575,113.996,712.933,116.35,722.497" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="230.515" y="628.284" fill="#000" font-size="13" textLength="101.677">Start confirmed</text><text x="135.9" y="643.417" fill="#000" font-size="13" textLength="290.907">[both participants, same unexpired attempt]</text></g><!--link InProgress to Completed--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk11" data-source-line="29" data-link-type="dependency"><path d="M127.82,763.177 C139.26,777.107 156.08,795.567 173.9,808.277 C238.16,854.097 319.622,886.17 370.782,903.78" style="stroke:#181818;stroke-width:1;" fill="none" id="InProgress-to-Completed"/><polygon points="375.51,905.407,368.302,898.695,370.782,903.78,365.698,906.26,375.51,905.407" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="357.165" y="851.344" fill="#000" font-size="13" textLength="144.377">Completion confirmed</text><text x="283.9" y="866.477" fill="#000" font-size="13" textLength="290.907">[both participants, same unexpired attempt]</text></g><!--link Declined to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0012" id="lnk13" data-source-line="32" data-link-type="dependency"><path d="M661.65,487.137 C695.18,521.667 762.05,597.627 786.9,677.217 C830.04,815.327 788.677,991.373 776.967,1035.713" style="stroke:#181818;stroke-width:1;" fill="none" id="Declined-to-*end*"/><polygon points="775.69,1040.547,781.855,1032.867,776.967,1035.713,774.121,1030.824,775.69,1040.547" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Completed to *end*--><g class="link" data-entity-1="ent0005" data-entity-2="ent0012" id="lnk14" data-source-line="33" data-link-type="dependency"><path d="M462.31,937.147 C544.47,967.177 713.744,1029.05 757.864,1045.18" style="stroke:#181818;stroke-width:1;" fill="none" id="Completed-to-*end*"/><polygon points="762.56,1046.897,755.481,1040.05,757.864,1045.18,752.734,1047.563,762.56,1046.897" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><g class="legend" data-source-line="94"><rect x="262.382" y="1123.074" width="313.276" height="221.859" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="267.382" y="1141.069" fill="#000" font-size="14" textLength="303.276">Separate status fields (not booking states):</text><text x="267.382" y="1157.366" fill="#000" font-size="14"> </text><text x="267.382" y="1173.663" fill="#000" font-size="14" textLength="210.998">booking_confirmations.status:</text><text x="267.382" y="1189.959" fill="#000" font-size="14" textLength="198.488">pending, confirmed, expired</text><text x="267.382" y="1206.256" fill="#000" font-size="14"> </text><text x="267.382" y="1222.553" fill="#000" font-size="14" textLength="206.377">calendar_events.sync_status:</text><text x="267.382" y="1238.85" fill="#000" font-size="14" textLength="163.146">pending, synced, failed</text><text x="267.382" y="1255.147" fill="#000" font-size="14"> </text><text x="267.382" y="1271.444" fill="#000" font-size="14" textLength="111.412">disputes.status:</text><text x="267.382" y="1287.741" fill="#000" font-size="14" textLength="103.742">open, resolved</text><text x="267.382" y="1304.038" fill="#000" font-size="14"> </text><text x="267.382" y="1320.334" fill="#000" font-size="14" textLength="227.835">Cancellation and no-show states</text><text x="267.382" y="1336.631" fill="#000" font-size="14" textLength="250.154">are not defined in the current draft.</text></g><?plantuml-src jLPDZzis4BthLmpsahQmVIXosaE0pIxQBb0WcspIIx9OqEJ88agH2eUow_pwp52Y93jkYXReoIRd-ysReLx00wO7vGZMy8WwsU3XvURbvkVg1RmEuK_hT_2xhL4VjKDuJ2eXt5crYweL3KLeW4sCIchBXqrhG7a3gS79SSJFlOtOea-KXJqXQ5QcgaesELoay4yXAs9nf_WlKADCE8XopRPODTOWODkb8nWa7MqdnLIBEaXSKPL_uEeTfuMKq5o18fXEHNoZDNP5MWv5U8VQMJyAow48xpqynB2BI9JbzxuSYyPjQ3k7nVbqabpllKrMkI7NwkDFJx1UlvgpWsluGpbhO3lM50S9aDeF3dv3rs5a2BGbgNys5KSbL_OpAyeDVV8VLP-Q4EqN5ZTP-5ITcHSSPdELRovQvrwJ2ucJ98oS7wWKMgkLSySdoVMHRwr6AJOcqC7NDhOgjssA965d13dmur8P3KVUXjG0ao9PRJl5B5in72r2x_6lZfadSPCmuoIe7c0Nmfz4NWIJs5DtEFJjDoR_8VulrfV-KZNrGq9njwivNBbP47WlhSzPGkmTc_l0T79O9mZrWi80RxmxWkgw61Zs5MT2FNNe3URfYmIjEcOERIhMVi_JIkXu_5dUOOAsPqfjqGKEcaAUvd3m62TjPob9HjBYE54aMQvwj1sIpGRtFlylYWGc06SEEgACWofatbISeKXGYfuOC55zBZdQNPDhdWOJc1T1e2wRIEBtU3qID6jyuChNjTBYp2akRq11Xdr4wYhd-si8EzuyjyfnFYe27RrkOl3sou1zqBgFn8ggJjC8AAzn0pUyZApZDCviMDa4f5nsxyq0gJghS49NplCOsRmIc2sdr2z-Uv9wqBB726_ViPZtO12pDHC0jdrAmLFs_VgSg4EpHeSv9o6kE3sdRhQ_uLMFQx928uvGLCuIcWfLPY-ePByNMtnX52yrUR50lu_FF9__FowBdFyzH0vvNTCI65Yy6gSWpHlXmY3mwk6LAY3DhmZm9jXRFF1Z6vbapeL3VgHb8sJ2pgd_NVKy5Zb5disOVMN5EqjTBpYBtnILbYPONYfvi_ZaZgp4gIpBaZtNdrKqBRtl5ZGzgmAgEJVHoWl5kfaOlATeujECzcdeDvaDTEHrrPOT